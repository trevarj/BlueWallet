name: Tests e2e Android

on: [pull_request]

permissions:
  contents: read

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: mainnet
            flavor: mainnet
          - profile: testnet
            flavor: bitcoinTestnet
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        max-jobs = 1
        cores = 2

    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Free disk space (Ubuntu)
      run: |
        echo "Disk before cleanup:" && df -h
        sudo rm -rf /usr/share/dotnet /opt/ghc
        sudo apt-get clean
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /usr/local/share/boost || true
        sudo rm -rf /usr/local/lib/android/sdk/ndk || true
        sudo docker system prune -af || true
        sudo rm -rf /usr/local/lib/android/sdk/system-images || true
        sudo rm -rf /usr/local/lib/android/sdk/emulator || true
        rm -rf ~/.gradle/caches/modules-2/files-2.1 || true
        rm -rf ~/.gradle/caches/build-cache || true
        rm -rf ~/.npm/_cacache ~/.cache || true
        sudo rm -rf /home/runner/work/_temp || true
        echo "Disk after cleanup:" && df -h

    - name: Specify node version
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24
        cache: 'npm'

    - name: Use gradle caches
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle', 'android/**/*.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Install node_modules
      run: npm ci || npm ci

    - name: Use specific Java version for sdkmanager to work
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Install pinned Nix for Android and the BHWI source producer
      run: |
        curl -fsS https://releases.nixos.org/nix/nix-2.31.2/nix-2.31.2-x86_64-linux.tar.xz -o /tmp/nix.tar.xz
        echo "d1f67c86eed016214864ba08bfb9529c307aea7e8fafb74853f96fcc3bfd8a60 /tmp/nix.tar.xz" | sha256sum --check
        tar -xJf /tmp/nix.tar.xz -C /tmp
        /tmp/nix-2.31.2-x86_64-linux/install --no-daemon --yes
        echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"


    - name: Build
      run: nix develop --max-jobs 1 --cores 2 -c bash tests/e2e/detox-build-release-apk.sh ${{ matrix.profile }}

    - name: Package APKs
      run: |
        tar -czf bluewallet-android-apks-${{ matrix.profile }}.tar.gz \
          android/app/build/outputs/apk/${{ matrix.flavor }}/release/app-${{ matrix.flavor }}-release.apk \
          android/app/build/outputs/apk/androidTest/${{ matrix.flavor }}/release/app-${{ matrix.flavor }}-release-androidTest.apk

    - name: Upload APKs
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: bluewallet-android-apks-${{ matrix.profile }}
        path: bluewallet-android-apks-${{ matrix.profile }}.tar.gz
        retention-days: 3
        compression-level: 0
        if-no-files-found: error

  test:
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: mainnet
            test-script: e2e:release-test
          - profile: testnet
            test-script: e2e:testnet:release-test
    env:
      HD_MNEMONIC: ${{ secrets.HD_MNEMONIC }}
      HD_MNEMONIC_BIP84: ${{ secrets.HD_MNEMONIC_BIP84 }}

    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Free disk space (Ubuntu)
      run: |
        echo "Disk before cleanup:" && df -h
        sudo rm -rf /usr/share/dotnet /opt/ghc
        sudo apt-get clean
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /usr/local/share/boost || true
        sudo rm -rf /usr/local/lib/android/sdk/ndk || true
        sudo docker system prune -af || true
        rm -rf ~/.npm/_cacache ~/.cache || true
        sudo rm -rf /home/runner/work/_temp || true
        echo "Disk after cleanup:" && df -h

    - name: Ensure artifacts directory
      run: mkdir -p ${{ github.workspace }}/artifacts

    - name: Specify node version
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24
        cache: 'npm'

    - name: Install node_modules
      run: npm ci || npm ci

    - name: Use specific Java version for sdkmanager to work
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Download APKs
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: bluewallet-android-apks-*
        merge-multiple: true

    - name: Restore APKs
      run: |
        for profile in mainnet testnet; do
          tar -xzf "bluewallet-android-apks-$profile.tar.gz"
        done

    - name: Run tests
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        api-level: 36
        profile: pixel
        avd-name: Pixel_API_29_AOSP
        emulator-port: 5554
        force-avd-creation: true
        enable-hw-keyboard: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -partition-size 2047
        arch: x86_64
        script: >-
          if [ '${{ matrix.profile }}' = testnet ]; then
          [ "$ANDROID_SERIAL" = emulator-5554 ] &&
          adb -s "$ANDROID_SERIAL" install -r android/app/build/outputs/apk/mainnet/release/app-mainnet-release.apk &&
          adb -s "$ANDROID_SERIAL" install -r android/app/build/outputs/apk/androidTest/mainnet/release/app-mainnet-release-androidTest.apk &&
          adb -s "$ANDROID_SERIAL" install -r android/app/build/outputs/apk/bitcoinTestnet/release/app-bitcoinTestnet-release.apk &&
          adb -s "$ANDROID_SERIAL" install -r android/app/build/outputs/apk/androidTest/bitcoinTestnet/release/app-bitcoinTestnet-release-androidTest.apk
          || exit 1; fi;
          npm run ${{ matrix.test-script }} -- --record-videos failing --record-logs failing --take-screenshots failing --headless --retries 4 --reuse --artifacts-location ${{ github.workspace }}/artifacts

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: failure()
      with:
        name: e2e-android-videos-${{ matrix.profile }}
        path: ${{ github.workspace }}/artifacts
